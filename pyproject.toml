[project]
name = "invoice-api"
version = "1.2.0"
description = "Invoice API — batch presign, confirm, and status endpoints"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Victor Gabriel Lucio", email = "victor_tiss@outlook.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.0.0",
    "invoice-models @ git+https://github.com/contabiliz/invoice-models.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "python-semantic-release>=9.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
tag_format = "v{version}"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
